<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="title desc">
  <title id="title">Lotion — Notion Clone with AI Agent</title>
  <desc id="desc">类 Notion 的全栈笔记应用：无限层级文档树、BlockNote 富文本编辑器，右侧窗口展示 DeepSeek AI Agent 的 SSE 事件流（note_created / references）。</desc>

  <defs>
    <linearGradient id="cardShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="420" rx="26" fill="#F6F5F1"/>

  <!-- 左侧：标题区 -->
  <g id="title-block" transform="translate(64 0)">
    <text x="0" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="16" letter-spacing="2.5" fill="#4D6BFE">NOTION CLONE · DEEPSEEK AGENT</text>
    <text x="0" y="158" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, sans-serif"
          font-size="72" font-weight="800" fill="#1C1B18">Lotion</text>
    <text x="0" y="206" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, sans-serif"
          font-size="20" font-weight="600" fill="#1C1B18">无限层级文档树 · BlockNote 富文本编辑</text>
    <text x="0" y="236" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, sans-serif"
          font-size="20" fill="#57544C">DeepSeek Agent 自动搜索、读写与整理笔记</text>
    <text x="0" y="270" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="15" fill="#75726A">NEXT.JS 15 · SUPABASE · BLOCKNOTE · AI SDK V7</text>

    <!-- 文档树 motif：parentDocument 无限嵌套 -->
    <g id="doc-tree">
      <line x1="78" y1="296" x2="78" y2="352" stroke="#D8D5CC" stroke-width="2"/>
      <line x1="106" y1="328" x2="106" y2="352" stroke="#E3E0D6" stroke-width="2"/>
      <circle cx="78" cy="304" r="3.5" fill="#1C1B18"/>
      <circle cx="106" cy="328" r="3.5" fill="#75726A"/>
      <circle cx="134" cy="352" r="3.5" fill="#B0ACA1"/>
      <text x="94" y="309" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, sans-serif"
            font-size="15" fill="#1C1B18">我的笔记</text>
      <text x="122" y="333" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, sans-serif"
            font-size="15" fill="#57544C">设计文档</text>
      <text x="150" y="357" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, sans-serif"
            font-size="15" fill="#75726A">API 草案</text>
    </g>
  </g>

  <!-- 右侧：编辑器 + AI 事件流窗口 -->
  <g id="editor-window">
    <rect x="730" y="68" width="412" height="292" rx="14" fill="url(#cardShadow)"/>
    <rect x="724" y="60" width="412" height="292" rx="14" fill="#FFFFFF" stroke="#E7E4DB" stroke-width="1.5"/>

    <!-- 窗口顶栏 -->
    <circle cx="748" cy="86" r="5" fill="#FF5F57"/>
    <circle cx="766" cy="86" r="5" fill="#FEBC2E"/>
    <circle cx="784" cy="86" r="5" fill="#28C840"/>
    <text x="930" y="91" text-anchor="middle"
          font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="13" fill="#9A968C">UNTITLED — LOTION</text>

    <!-- 文档内容 -->
    <rect x="748" y="116" width="44" height="44" rx="10" fill="#EEF0FF"/>
    <path d="M 758 128 h 16 a 4 4 0 0 1 4 4 v 16 a 4 4 0 0 1 -4 4 h -16 a 4 4 0 0 1 -4 -4 v -16 a 4 4 0 0 1 4 -4 z" fill="#4D6BFE"/>
    <path d="M 762 148 h 16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <text x="808" y="146" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, sans-serif"
          font-size="22" font-weight="700" fill="#1C1B18">Lotion 开发计划</text>
    <rect x="748" y="180" width="300" height="8" rx="4" fill="#EDEBE4"/>
    <rect x="748" y="196" width="240" height="8" rx="4" fill="#EDEBE4"/>

    <!-- checklist：已完成 + 未完成 -->
    <rect x="748" y="220" width="14" height="14" rx="3" fill="#4D6BFE"/>
    <path d="M 751.5 227 l 3.5 3.5 l 6 -6.5" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="772" y="223" width="180" height="8" rx="4" fill="#EDEBE4"/>
    <rect x="748" y="244" width="14" height="14" rx="3" fill="none" stroke="#D8D5CC" stroke-width="2"/>
    <rect x="772" y="247" width="140" height="8" rx="4" fill="#EDEBE4"/>

    <!-- AI Agent 事件流 -->
    <g id="ai-stream">
      <rect x="748" y="272" width="364" height="36" rx="10" fill="#23232E"/>
      <text x="764" y="290" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" letter-spacing="1.5" fill="#8B8BA3">AI AGENT · DEEPSEEK</text>
      <rect x="764" y="302" width="96" height="19" rx="9.5" fill="#4D6BFE"/>
      <text x="812" y="315.5" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#FFFFFF">note_created</text>
      <text x="872" y="315.5" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, sans-serif"
            font-size="13" fill="#E8E8F2">草稿《会议纪要》已创建，待确认</text>
      <rect x="872" y="302" width="82" height="19" rx="9.5" fill="#3A3948"/>
      <text x="913" y="315.5" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
            font-size="11" fill="#C9C8DC">references</text>
    </g>
  </g>
</svg>
